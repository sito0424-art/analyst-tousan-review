<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホームベーカリー損益分岐シミュレータ | アナリスト父さんの何でもレビュー</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 12px; color: #222; background: #fff; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; margin: 10px 0 2px; font-size: 14px; }
  label b { font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; }
  .result { margin-top: 12px; padding: 10px 12px; background: #f4f6f8; border-radius: 8px; line-height: 1.8; font-size: 14px; }
  .result strong { font-variant-numeric: tabular-nums; }
  svg { width: 100%; margin-top: 10px; }
  .legend { font-size: 12px; color: #555; }
  .note { font-size: 11px; color: #666; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
<h1>ホームベーカリー損益分岐シミュレータ</h1>

<label>本体価格 <b id="v-machine"></b><br>
<input id="in-machine" type="range" min="8000" max="40000" step="1000" value="20000"></label>

<label>市販の食パン 1斤の価格 <b id="v-store"></b><br>
<input id="in-store" type="range" min="120" max="300" step="5" value="180"></label>

<label>自家製1斤のコスト（材料＋電気代） <b id="v-home"></b><br>
<input id="in-home" type="range" min="80" max="170" step="1" value="112"></label>

<label>週に食べる量 <b id="v-weekly"></b><br>
<input id="in-weekly" type="range" min="1" max="7" step="0.5" value="3"></label>

<div class="result">
<div>1斤あたりの差額: <strong id="out-diff"></strong></div>
<div>元が取れるまで: <strong id="out-be"></strong></div>
<div>5年間での節約見込み: <strong id="out-save5"></strong></div>
</div>

<svg id="chart" viewBox="0 0 320 190" role="img" aria-label="累計コストの比較グラフ">
  <line x1="34" y1="10" x2="34" y2="160" stroke="#ccc"/>
  <line x1="34" y1="160" x2="312" y2="160" stroke="#ccc"/>
  <polyline id="line-store" fill="none" stroke="#888" stroke-width="2"/>
  <polyline id="line-bake" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle id="dot" r="3.5" fill="#2563eb" style="display:none"/>
  <text x="36" y="176" font-size="9" fill="#666">0</text>
  <text x="160" y="176" font-size="9" fill="#666">1.5年</text>
  <text x="288" y="176" font-size="9" fill="#666">3年</text>
  <text id="ymax" x="2" y="16" font-size="9" fill="#666"></text>
</svg>
<div class="legend"><span style="color:#888">■</span> 市販パンを買い続けた場合の累計　<span style="color:#2563eb">■</span> ホームベーカリーの累計（本体＋材料費）</div>

<p class="note">前提: 自家製1斤のコスト初期値112円は、強力粉250g 約75円（1kg 300円換算）＋イースト・バター等 約25円＋電気代 約12円（0.4kWh×31円）の試算です。実際の価格に合わせてスライダーで調整してください。手間（作業時間）は金額換算していません。</p>
</div>
<script>
(function(){
  var keys=['machine','store','home','weekly'];
  function yen(n){ return Math.round(n).toLocaleString('ja-JP')+'円'; }
  function read(){ var s={}; keys.forEach(function(k){ s[k]=parseFloat(document.getElementById('in-'+k).value); }); return s; }
  function render(){
    var s=read();
    document.getElementById('v-machine').textContent=yen(s.machine);
    document.getElementById('v-store').textContent=yen(s.store);
    document.getElementById('v-home').textContent=yen(s.home);
    document.getElementById('v-weekly').textContent=s.weekly+'斤';
    var diff=s.store-s.home;
    var dot=document.getElementById('dot');
    if(diff<=0){
      document.getElementById('out-diff').textContent=yen(diff)+'（自家製の方が高い）';
      document.getElementById('out-be').textContent='この条件では元は取れません';
      document.getElementById('out-save5').textContent='—';
    } else {
      var loaves=s.machine/diff, weeks=loaves/s.weekly;
      var period = weeks<52 ? '約'+Math.max(1,Math.round(weeks/4.33))+'ヶ月' : '約'+(weeks/52).toFixed(1)+'年';
      document.getElementById('out-diff').textContent=yen(diff);
      document.getElementById('out-be').textContent='約'+Math.ceil(loaves)+'斤（'+period+'）';
      var save5=diff*s.weekly*52*5-s.machine;
      document.getElementById('out-save5').textContent=(save5>=0?yen(save5):'マイナス '+yen(-save5));
    }
    var W=156, x0=34, x1=312, y0=160, y1=12;
    var maxV=Math.max(s.store, s.home)*s.weekly*W*1.05;
    function X(w){ return x0+(x1-x0)*w/W; }
    function Y(v){ return y0-(y0-y1)*v/maxV; }
    var ps=[], pb=[];
    for(var w=0; w<=W; w+=4){
      ps.push(X(w).toFixed(1)+','+Y(s.store*s.weekly*w).toFixed(1));
      pb.push(X(w).toFixed(1)+','+Y(s.machine+s.home*s.weekly*w).toFixed(1));
    }
    document.getElementById('line-store').setAttribute('points', ps.join(' '));
    document.getElementById('line-bake').setAttribute('points', pb.join(' '));
    document.getElementById('ymax').textContent=Math.round(maxV/10000)+'万円';
    if(diff>0){
      var bew=s.machine/(diff*s.weekly);
      if(bew<=W){ dot.style.display=''; dot.setAttribute('cx', X(bew)); dot.setAttribute('cy', Y(s.store*s.weekly*bew)); }
      else { dot.style.display='none'; }
    } else { dot.style.display='none'; }
  }
  keys.forEach(function(k){ document.getElementById('in-'+k).addEventListener('input', render); });
  render();
})();
</script>
</body>
</html>
